name: soft-launch-tests

on:
  push:
    branches: [ master, main ]
    paths:
      - services/api-services/soft-launch/**
      - .github/workflows/soft-launch-tests.yml
  pull_request:
    paths:
      - services/api-services/soft-launch/**
      - .github/workflows/soft-launch-tests.yml

jobs:
  bot-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/bot-session
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/bot-session
        run: pytest -q

  order-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/order-delivery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/order-delivery
        run: pytest -q

  softlaunch-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: services/api-services/soft-launch/services/notification
        run: npm ci
      - name: Test
        working-directory: services/api-services/soft-launch/services/notification
        run: npm test --silent

  cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/cart
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/cart
        run: pytest -q

  catalog-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/catalog-inventory
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/catalog-inventory
        run: pytest -q

  msme-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/msme-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/msme-engine
        run: pytest -q

  affiliate-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: services/api-services/soft-launch/services/affiliate-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: services/api-services/soft-launch/services/affiliate-engine
        run: pytest -q

  integration-e2e:
    runs-on: ubuntu-latest
    needs: [cart, catalog-inventory, msme-engine, affiliate-engine, bot-session, order-delivery, softlaunch-notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (python services)
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-services/soft-launch/services/catalog-inventory/requirements.txt
          pip install -r services/api-services/soft-launch/services/cart/requirements.txt
          pip install -r services/api-services/soft-launch/services/msme-engine/requirements.txt
          pip install -r services/api-services/soft-launch/services/affiliate-engine/requirements.txt
          pip install pytest httpx uvicorn

      - name: Install deps (notification)
        working-directory: services/api-services/soft-launch/services/notification
        run: npm ci --omit=dev

      - name: Start services
        run: |
          nohup uvicorn src.app.main:app --app-dir services/api-services/soft-launch/services/catalog-inventory/src --port 8520 --host 127.0.0.1 &
          nohup uvicorn src.app.main:app --app-dir services/api-services/soft-launch/services/cart/src --port 8530 --host 127.0.0.1 &
          nohup uvicorn src.app.main:app --app-dir services/api-services/soft-launch/services/msme-engine/src --port 8501 --host 127.0.0.1 &
          nohup uvicorn src.app.main:app --app-dir services/api-services/soft-launch/services/affiliate-engine/src --port 8500 --host 127.0.0.1 &
          PORT=8561 HOST=127.0.0.1 nohup node services/api-services/soft-launch/services/notification/app.js &
          sleep 3

      - name: Run integration tests
        working-directory: services/api-services/soft-launch
        run: |
          pytest -q integration-tests -k test_integration.py
