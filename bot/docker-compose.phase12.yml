services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - ntheemba_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ntheemba
      POSTGRES_USER: ntheemba
      POSTGRES_PASSWORD: ntheemba_local_change_me
    ports:
      - "5432:5432"
    volumes:
      - ntheemba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntheemba -d ntheemba"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ntheemba_redis_data:
  ntheemba_postgres_data:
