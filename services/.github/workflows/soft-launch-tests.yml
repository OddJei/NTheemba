name: soft-launch-tests

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: api-services/soft-launch/services/cart
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: api-services/soft-launch/services/cart
        run: pytest -q

  catalog-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        working-directory: api-services/soft-launch/services/catalog-inventory
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        working-directory: api-services/soft-launch/services/catalog-inventory
        run: pytest -q
