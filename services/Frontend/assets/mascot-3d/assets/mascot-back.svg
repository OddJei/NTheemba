<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title>NTheemba Back</title>
  <desc>Back view of the mascot for 3D flip transitions.</desc>

  <ellipse cx="100" cy="244" rx="52" ry="10" fill="#000" opacity=".22"/>

  <!-- BODY back plate + seam -->
  <g id="mascot-body" class="mascot-part" data-behavior="idle-float">
    <rect x="50" y="105" width="100" height="100" rx="18" ry="18" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    <rect x="98" y="110" width="4" height="88" fill="#1b2032" opacity=".5"/>
    <circle cx="100" cy="138" r="6" fill="#1b2032" opacity=".8"/>
  </g>

  <!-- ARMS (mirrored simple shapes) -->
  <g id="arm-left" class="mascot-part" transform="translate(70,120)">
    <g id="arm-left-upper" class="mascot-part">
      <rect x="-10" y="0" width="10" height="45" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    </g>
    <g id="arm-left-lower" class="mascot-part" transform="translate(-5,45)">
      <rect x="-5" y="0" width="10" height="34" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
      <rect x="-8" y="34" width="16" height="8" rx="3" fill="#22242c"/>
    </g>
  </g>
  <g id="arm-right" class="mascot-part" transform="translate(130,120)">
    <g id="arm-right-upper" class="mascot-part">
      <rect x="0" y="0" width="10" height="45" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    </g>
    <g id="arm-right-lower" class="mascot-part" transform="translate(5,45)">
      <rect x="0" y="0" width="10" height="34" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
      <rect x="-3" y="34" width="16" height="8" rx="3" fill="#22242c"/>
    </g>
  </g>

  <!-- LEGS -->
  <g id="leg-left" class="mascot-part" transform="translate(85,205)">
    <rect x="-9" y="0" width="18" height="36" rx="6" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    <rect x="-12" y="30" width="24" height="10" rx="4" fill="#22242c"/>
  </g>
  <g id="leg-right" class="mascot-part" transform="translate(115,205)">
    <rect x="-9" y="0" width="18" height="36" rx="6" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    <rect x="-12" y="30" width="24" height="10" rx="4" fill="#22242c"/>
  </g>

  <!-- HEAD back -->
  <g id="mascot-head" class="mascot-part" transform="translate(100,75)">
    <line x1="0" y1="-28" x2="0" y2="-12" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="5" fill="#3ae5c9" stroke="#12cdb1" stroke-width="2"/>
    <circle cx="-42" cy="-2" r="14" fill="#9aa3ad" stroke="#737c86" stroke-width="2"/>
    <circle cx="42" cy="-2" r="14" fill="#9aa3ad" stroke="#737c86" stroke-width="2"/>

    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#dfe6ee" stroke-width="2"/>
    <!-- back seam / panel -->
    <rect x="-2" y="-36" width="4" height="72" fill="#d1d9e4" opacity=".6"/>
    <circle cx="0" cy="8" r="6" fill="#1b2032" opacity=".35"/>
  </g>

  <g id="pivots">
    <circle cx="70" cy="120" r="2.5"/>
    <circle cx="130" cy="120" r="2.5"/>
    <circle cx="100" cy="105" r="2.5"/>
  </g>
</svg>
