# Prometheus scrape job for bot-session
# Add this job to your Prometheus `scrape_configs` or include this file
# via your central Prometheus config.

job_name: bot_session
metrics_path: /metrics
static_configs:
  - targets: ["bot-session:8000"]
    labels:
      service: bot-session
      environment: "${ENVIRONMENT:-local}"

# Notes:
# - Replace the target host/port with the real service address used by Prometheus.
# - If using Docker Compose, `bot-session:8000` may resolve when services share the same network.