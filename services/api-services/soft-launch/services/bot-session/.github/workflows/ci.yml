name: CI (inactive - use repo root workflows)

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r api-services/soft-launch/services/bot-session/requirements.txt
      - name: Run tests
        working-directory: api-services/soft-launch/services/bot-session
        run: |
          pytest -q
