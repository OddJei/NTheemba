app = "ntheemba-payment-revenue"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8590
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "payment_revenue_data"
  destination = "/data"

[env]
  # Use a Fly Volume so you don't lose state on restarts.
  DATABASE_URL = "sqlite+aiosqlite:////data/payment_revenue.db"
  PAWAPAY_BASE_URL = "https://api.sandbox.pawapay.io/v2"

  # Reconciliation job (checks status if callbacks were missed)
  PAWAPAY_RECONCILE_ENABLED = "true"
  PAWAPAY_RECONCILE_INTERVAL_SECONDS = "180"
  PAWAPAY_RECONCILE_STALE_SECONDS = "900"
  PAWAPAY_RECONCILE_BATCH_SIZE = "50"
