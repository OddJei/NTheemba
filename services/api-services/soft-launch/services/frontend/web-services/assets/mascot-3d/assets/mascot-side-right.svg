<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title>NTheemba Right</title>
  <desc>Right profile view for 3D transitions.</desc>

  <ellipse cx="100" cy="244" rx="52" ry="10" fill="#000" opacity=".22"/>

  <g id="mascot-body" class="mascot-part" data-behavior="idle-float">
    <rect x="54" y="105" width="88" height="100" rx="18" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    <rect x="90" y="130" width="42" height="36" rx="6" fill="#1b2032" opacity=".9"/>
  </g>

  <g id="arm-right" class="mascot-part" transform="translate(112,120)">
    <g id="arm-right-upper" class="mascot-part">
      <rect x="0" y="0" width="10" height="45" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    </g>
    <g id="arm-right-lower" class="mascot-part" transform="translate(5,45)">
      <rect x="0" y="0" width="10" height="34" rx="5" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
      <circle cx="5" cy="38" r="9" fill="#22242c"/>
    </g>
  </g>

  <g id="leg-right" class="mascot-part" transform="translate(102,205)">
    <rect x="-9" y="0" width="18" height="36" rx="6" fill="#ff7a22" stroke="#e1600c" stroke-width="2"/>
    <rect x="-12" y="30" width="24" height="10" rx="4" fill="#22242c"/>
  </g>

  <g id="mascot-head" class="mascot-part" transform="translate(90,75)">
    <line x1="0" y1="-28" x2="0" y2="-12" stroke="#9aa3ad" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="5" fill="#3ae5c9" stroke="#12cdb1" stroke-width="2"/>
    <circle cx="38" cy="-2" r="12" fill="#9aa3ad" stroke="#737c86" stroke-width="2"/>
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#dfe6ee" stroke-width="2"/>

    <g id="eye-right" class="mascot-part" data-behavior="blink" transform="translate(8,-2)">
      <circle cx="0" cy="0" r="8" fill="#1b2032" />
      <circle cx="0" cy="0" r="3.5" fill="#0c101a"/>
      <circle cx="-1.6" cy="-1.6" r="1.2" fill="#ffffff" opacity=".8"/>
    </g>
    <g id="jaw" class="mascot-part" transform="translate(0,12)">
      <rect id="mascot-mouth" x="-12" y="-2" width="24" height="6" rx="3" fill="#0c101a"/>
    </g>
  </g>

  <g id="pivots">
    <circle cx="112" cy="120" r="2.5"/>
    <circle cx="102" cy="205" r="2.5"/>
    <circle cx="90" cy="105" r="2.5"/>
  </g>
</svg>

