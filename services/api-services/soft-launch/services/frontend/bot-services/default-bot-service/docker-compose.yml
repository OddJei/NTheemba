version: '3.8'

services:
  # Redis for session storage
  redis:
    image: redis:7-alpine
    container_name: bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Default Bot Service
  bot-service:
    build: .
    container_name: default-bot-service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_PORT=8000
      - DEBUG=false
      - LOG_LEVEL=INFO
      # API Service URLs (ports 8100-8199)
      - AUTH_SERVICE_URL=http://auth-service:8100
      - SESSION_SERVICE_URL=http://session-service:8101
      - EVENT_SERVICE_URL=http://event-service:8102
      - NOTIFICATION_SERVICE_URL=http://notification-service:8103
      - CATALOG_SERVICE_URL=http://catalog-service:8104
      - ORDER_SERVICE_URL=http://order-service:8105
      - PAYMENT_SERVICE_URL=http://payment-service:8106
      - INVENTORY_SERVICE_URL=http://inventory-service:8107
      - USER_SERVICE_URL=http://user-service:8108
      - BUSINESS_SERVICE_URL=http://business-service:8109
      - AFFILIATE_SERVICE_URL=http://affiliate-service:8110
      - ANALYTICS_SERVICE_URL=http://analytics-service:8111
      - REPORT_SERVICE_URL=http://report-service:8112
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Mock API Services (for development/testing)
  auth-service:
    image: mockserver/mockserver:5.15.0
    container_name: auth-service
    ports:
      - "8100:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/auth-service.json
    volumes:
      - ./mock-services/auth-service.json:/config/auth-service.json
    restart: unless-stopped

  session-service:
    image: mockserver/mockserver:5.15.0
    container_name: session-service
    ports:
      - "8101:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/session-service.json
    volumes:
      - ./mock-services/session-service.json:/config/session-service.json
    restart: unless-stopped

  event-service:
