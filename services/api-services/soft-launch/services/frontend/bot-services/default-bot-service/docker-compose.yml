      - "8102:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/event-service.json
    volumes:
      - ./mock-services/event-service.json:/config/event-service.json
    restart: unless-stopped

  notification-service:
    image: mockserver/mockserver:5.15.0
    container_name: notification-service
