name: ICE Tests

on:
  push:
    paths:
      - 'services/ice/**'
  pull_request:
    paths:
      - 'services/ice/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx sqlalchemy aiosqlite redis
      - name: Run ICE tests
        run: |
          pytest -q services/ice/tests/test_confirm_endpoint.py services/ice/tests/test_confirm_e2e.py
