[project]
name = "bot-intent-service"
version = "0.1.0"
description = "Async intent resolver service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.uvicorn]
factory = true
