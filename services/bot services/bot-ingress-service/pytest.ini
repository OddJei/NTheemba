[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# Configure pytest-asyncio loop scope to avoid deprecation warnings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# Suppress a few known third-party deprecation warnings during test runs
filterwarnings =
    ignore:The `parse_obj` method is deprecated:DeprecationWarning
    ignore:PydanticDeprecatedSince20:DeprecationWarning
    ignore::pytest.PytestDeprecationWarning

